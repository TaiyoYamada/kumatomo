name: iOS CI

on:
  push:
    paths:
      - 'kumatomo_ios/**'
      - 'kumatomo.xcodeproj/**'
      - 'kumatomoTests/**'
      - 'kumatomoUITests/**'
      - 'TestPlans/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'kumatomo_ios/**'
      - 'kumatomo.xcodeproj/**'
      - 'kumatomoTests/**'
      - 'kumatomoUITests/**'
      - 'TestPlans/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --config kumatomo_ios/.swiftlint.yml kumatomo_ios/

  format:
    name: SwiftFormat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftFormat
        run: |
          curl -sSL https://github.com/nicklockwood/SwiftFormat/releases/download/0.58.7/swiftformat_linux.zip -o swiftformat.zip
          unzip swiftformat.zip
          chmod +x swiftformat_linux
          sudo mv swiftformat_linux /usr/local/bin/swiftformat

      - name: Run SwiftFormat (lint mode)
        run: |
          cd kumatomo_ios
          swiftformat --lint --config .swiftformat .

  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache Swift Package Manager
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', '**/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build and Test
        run: |
          xcodebuild test \
            -project kumatomo.xcodeproj \
            -scheme "kumatomo Debug-Simulator" \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -configuration Debug-Simulator \
            -resultBundlePath TestResults.xcresult \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
