services:
    laravel.test:
        build:
            context: './api/vendor/laravel/sail/runtimes/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: laravelsail/php84-composer:latest
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # ports:
        #     - '${APP_PORT:-8000}:80'
        #     - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            HTTPS: 'on'
        volumes:
            - './api:/var/www/html'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
            - meilisearch
            - mailpit
            - selenium
    
    nginx:
        image: nginx:alpine
        ports:
            # - '${APP_PORT:-80}:80'
            - '443:443'
        volumes:
            # - '.:/var/www/html:ro'
            - './docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro'
            - './docker/nginx/ssl:/etc/nginx/ssl:ro'
        networks:
            - sail
        depends_on:
            - laravel.test
        restart: unless-stopped
            
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './api/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    
    # minio:
    #     image: 'minio/minio:latest'
    #     ports:
    #         - '${FORWARD_MINIO_PORT:-9000}:9000'
    #         - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
    #     environment:
    #         MINIO_ROOT_USER: sail
    #         MINIO_ROOT_PASSWORD: password
    #     volumes:
    #         - 'sail-minio:/data'
    #     networks:
    #         - sail
    #     command: 'minio server /data --console-address ":8900"'
    #     healthcheck:
    #         test:
    #             - CMD
    #             - mc
    #             - ready
    #             - local
    #         retries: 3
    #         timeout: 5s
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail

    vue.admin:
        build:
            context: ./admin
            dockerfile: Dockerfile
        # ports:
        #     - '3000:3000'
        volumes:
            - ./admin:/app
            - /app/node_modules
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        working_dir: /app
        networks:
            - sail

    ollama:
        image: 'ollama/ollama:latest'
        # ports:
        #     - '${FORWARD_OLLAMA_PORT:-11434}:11434'
        volumes:
            - 'sail-ollama:/root/.ollama'
        networks:
            - sail
        environment:
            - OLLAMA_HOST=0.0.0.0
            - OLLAMA_ORIGINS=*
        # healthcheck:
        #     test:
        #         - CMD
        #         - curl
        #         - '-f'
        #         - 'http://localhost:11434/api/tags'
        #     retries: 3
        #     timeout: 10s
        #     interval: 30s
        restart: unless-stopped

    ollama-init:
        image: 'ollama/ollama:latest'
        volumes:
            - 'sail-ollama:/root/.ollama'
            - './docker/ollama/init-ollama.sh:/init-ollama.sh'
        networks:
            - sail
        environment:
            - OLLAMA_HOST=ollama:11434
            - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma:2b}
        depends_on:
            ollama:
                condition: service_started
                # condition: service_healthy # こっちがいいけど、コンテナ作れなくなるから一旦やめる
        command: ["/bin/bash", "/init-ollama.sh"]
        restart: "no" 
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
    sail-ollama:
        driver: local
