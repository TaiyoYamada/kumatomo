AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: kumatomo Laravel API with Bref
Parameters:
  Environment:
    Type: String
    Default: prod
  ProjectName:
    Type: String
    Default: kumatomo
Globals:
  Function:
    Timeout: 28
    MemorySize: 1024
    Runtime: provided.al2
    Architectures:
    - x86_64
    Environment:
      Variables:
        APP_ENV: production
        APP_DEBUG: 'false'
        LOG_CHANNEL: stderr
        SESSION_DRIVER: cookie
        SSM_PREFIX:
          Fn::Sub: /${ProjectName}/${Environment}
Resources:
  WebFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-web
      Description: Laravel web handler
      Handler: public/index.php
      CodeUri: WebFunction
      Layers:
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:534081306603:layer:php-84-fpm:5
      Events:
        HttpApi:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootHttpApi:
          Type: HttpApi
          Properties:
            Path: /
            Method: ANY
      Policies:
      - SSMParameterReadPolicy:
          ParameterName:
            Fn::Sub: ${ProjectName}/${Environment}/*
      - S3CrudPolicy:
          BucketName:
            Fn::Sub: ${ProjectName}-media-${Environment}
    Metadata:
      BuildMethod: makefile
      SamResourceId: WebFunction
  ArtisanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-artisan
      Description: Laravel Artisan CLI
      Handler: artisan
      CodeUri: ArtisanFunction
      Timeout: 720
      Layers:
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:534081306603:layer:php-84:5
      - Fn::Sub: arn:aws:lambda:${AWS::Region}:534081306603:layer:console:72
      Policies:
      - SSMParameterReadPolicy:
          ParameterName:
            Fn::Sub: ${ProjectName}/${Environment}/*
      - S3CrudPolicy:
          BucketName:
            Fn::Sub: ${ProjectName}-media-${Environment}
    Metadata:
      BuildMethod: makefile
      SamResourceId: ArtisanFunction
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebFunctionArn:
    Description: Web Lambda function ARN
    Value:
      Fn::GetAtt:
      - WebFunction
      - Arn
  ArtisanFunctionArn:
    Description: Artisan Lambda function ARN
    Value:
      Fn::GetAtt:
      - ArtisanFunction
      - Arn
